name: TriliumNext Notes
version: "v0.96.0"
slug: trilium_next
description: >
  Hierarchical note-taking application with encryption, Markdown support,
  and personal knowledge base features
url: https://github.com/triliumnext/trilium
ingress: true
ingress_port: 8080
ingress_stream: true
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
command: ./run.sh
map:
  - type: data
    read_only: false
    path: /data/trilium-data
  - type: config
    read_only: false
    path: /config
options:
  timezone: Europe/Berlin
  log_level: info
  https_only: false
  oauth_base_url: https://trilium.domain.com
  oauth_client_id: CLIENTID
  oauth_client_secret: CLIENTSECRET
  oauth_issuer_base_url: https://auth.domain.com/application/o/trilium/.well-known/openid-configuration
  oauth_issuer_name: Authentik
  oauth_issuer_icon: https://auth.domain.com/media/logo.png
schema:
  timezone:
    type: string
    enum:
      - Europe/Berlin
      - America/New_York
      - UTC
      - Asia/Berlin
      - Europe/London
      - Asia/Tokyo
      - Australia/Sydney
  log_level:
    type: string
    enum:
      - trace
      - debug
      - info
      - notice
      - warning
      - error
      - fatal
  https_only:
    type: boolean
  oauth_base_url:
    type: string
  oauth_client_id:
    type: string
  oauth_client_secret:
    type: string
  oauth_issuer_base_url:
    type: string
  oauth_issuer_name:
    type: string
  oauth_issuer_icon:
    type: string
panel_icon: mdi:notebook-multiple
panel_title: Trilium
webui: "http://[HOST]:[PORT:8080]/"
ports:
  "8080/tcp": 8080
