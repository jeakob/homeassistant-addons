name: "TriliumNext Notes"
version: "v0.97.0"
slug: trilium_next
description: "Hierarchical note-taking application with encryption, Markdown support, and personal knowledge base features"
url: "https://github.com/triliumnext/trilium"
ingress: true
ingress_port: 8080
ingress_stream: true
panel_icon: mdi:notebook-multiple
panel_title: Trilium
webui: "http://[HOST]:[PORT:8080]/"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
map:
  - type: data
    read_only: false
    path: /data/trilium-data
  - type: config
    read_only: false
    path: /config
ports:
  "8080/tcp": 8080

options:
  timezone: "Europe/Berlin"
  log_level: "info"
  https_only: false
  oauth_base_url: ""
  oauth_client_id: ""
  oauth_client_secret: ""
  oauth_issuer_base_url: ""
  oauth_issuer_name: "Authentik"
  oauth_issuer_icon: ""

schema:
  timezone: |
    list(Europe/Berlin|America/New_York|UTC|Asia/Berlin|Europe/London|Asia/Tokyo|Australia/Sydney)
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
  https_only: "bool"
  oauth_base_url: "str"
  oauth_client_id: "str"
  oauth_client_secret: "str"
  oauth_issuer_base_url: "str"
  oauth_issuer_name: "str"
  oauth_issuer_icon: "str"

environment:
  # Core settings
  TZ: "{{ options.timezone }}"
  NODE_ENV: "production"
  HOST: "0.0.0.0"

  # Trilium data directory
  TRILIUM_DATA_DIR: "/data/trilium-data"

  # OAuth/OpenID Connect settings
  TRILIUM_OAUTH_BASE_URL: "{{ options.oauth_base_url }}"
  TRILIUM_OAUTH_CLIENT_ID: "{{ options.oauth_client_id }}"
  TRILIUM_OAUTH_CLIENT_SECRET: "{{ options.oauth_client_secret }}"
  TRILIUM_OAUTH_ISSUER_BASE_URL: "{{ options.oauth_issuer_base_url }}"
  TRILIUM_OAUTH_ISSUER_NAME: "{{ options.oauth_issuer_name }}"
  TRILIUM_OAUTH_ISSUER_ICON: "{{ options.oauth_issuer_icon }}"
